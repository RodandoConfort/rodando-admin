<section class="empty-state">
  <mat-icon class="empty-state__icon" aria-hidden="true">
    {{ icon() }}
  </mat-icon>

  <h3 class="empty-state__title">{{ title() }}</h3>

  @if (description()) {
    <p class="empty-state__description">
      {{ description() }}
    </p>
  }

  @if (actionLabel()) {
    <button mat-flat-button type="button" (click)="action.emit()">
      {{ actionLabel() }}
    </button>
  }
</section>
